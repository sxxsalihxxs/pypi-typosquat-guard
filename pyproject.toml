[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "typosquat-guard"
dynamic = ["version"]
description = "Catch typosquatted and look-alike Python packages before they reach your supply chain"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Salih Uğurlu" }]
keywords = ["security", "supply-chain", "typosquatting", "pypi", "dependencies", "devsecops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/sxxsalihxxs/typosquat-guard"
Issues = "https://github.com/sxxsalihxxs/typosquat-guard/issues"

[project.scripts]
typosquat-guard = "typosquat_guard.cli:main"

[tool.setuptools.dynamic]
version = { attr = "typosquat_guard.__version__" }

[tool.setuptools.package-data]
typosquat_guard = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
