# Dogfooding: run this repository's own action against the example files on every PR.
name: Typosquat Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the intentionally suspicious example
        uses: ./
        with:
          files: examples/requirements-suspicious.txt
          fail-on: never
